name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run check:ports
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run boundaries
      - run: bun install -g @colbymchenry/codegraph@1.6.2
      - run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: codegraph init -i
      - name: Run affected tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/affected-tests.sh
      - run: bun run build:binary

  postgres-integration:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneytrap
          POSTGRES_PASSWORD: moneytrap
          POSTGRES_DB: moneytrap
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U moneytrap -d moneytrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://moneytrap:moneytrap@127.0.0.1:5433/moneytrap
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun install -g @colbymchenry/codegraph@1.6.2
      - run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: codegraph init -i
      - name: Run affected database tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/affected-tests.sh packages/adapter-postgres
      - name: Run affected auth database tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/affected-tests.sh apps/server/src/auth
