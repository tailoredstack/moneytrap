name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:docs
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run boundaries
      - run: bun test
      - run: bun run build:binary

  postgres-integration:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneytrap
          POSTGRES_PASSWORD: moneytrap
          POSTGRES_DB: moneytrap
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U moneytrap -d moneytrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://moneytrap:moneytrap@127.0.0.1:5433/moneytrap
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test packages/adapter-postgres/src/migrate.test.ts
