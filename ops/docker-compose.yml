services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moneytrap
      POSTGRES_PASSWORD: moneytrap
      POSTGRES_DB: moneytrap
    ports:
      - "127.0.0.1:${MONEYTRAP_PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytrap -d moneytrap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MONEYTRAP_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
