services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moneytrap
      POSTGRES_PASSWORD: moneytrap
      POSTGRES_DB: moneytrap
    ports:
      - "127.0.0.1:${MONEYTRAP_PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytrap -d moneytrap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MONEYTRAP_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local mail capture: the server sends over SMTP on 1025 and the web UI on 8025 lists what arrived. Nothing is
  # delivered outside this machine. If you change MONEYTRAP_SMTP_PORT, set SMTP_PORT in apps/server/.env to the same value.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${MONEYTRAP_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MONEYTRAP_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
